<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phronesis — Practical Wisdom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --brand:#6c63ff;
      --brand-soft:#8a82ff;
      --ink:#0c0c14;
      --paper:#fafafa;
      --text:#1a1a24;
      --text-soft:#6b6b7d;
      --line:#e4e4ea;
      --font:'Inter',sans-serif;
      --mono:'JetBrains Mono',monospace;
    }
    html,body{height:100%;overflow:hidden}
    body{font-family:var(--font);background:var(--paper);color:var(--text)}

    /* faint grid — barely there */
    .grid-bg{
      position:fixed;inset:0;
      background-image:linear-gradient(rgba(108,99,255,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(108,99,255,0.035) 1px,transparent 1px);
      background-size:64px 64px;pointer-events:none;z-index:0;
      -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 45%, black 30%, transparent 75%);
      mask-image:radial-gradient(ellipse 80% 60% at 50% 45%, black 30%, transparent 75%);
    }

    #bg-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.55}

    /* ── nav ── */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:100;
      padding:1.5rem 3rem;display:flex;align-items:center;justify-content:space-between;
    }
    .nav-logo{
      font-size:1.05rem;font-weight:700;color:var(--text);letter-spacing:-0.01em;
      display:flex;align-items:center;gap:8px;
    }
    .nav-logo .dot{width:6px;height:6px;border-radius:50%;background:var(--brand)}
    .nav-logo span{color:var(--brand)}
    .nav-links{display:flex;align-items:center;gap:2.25rem}
    .nav-links a{
      font-size:0.85rem;font-weight:500;color:var(--text-soft);
      text-decoration:none;cursor:pointer;transition:color 0.2s;
    }
    .nav-links a:hover{color:var(--text)}
    .nav-cta{
      padding:0.55rem 1.4rem;font-size:0.82rem;font-weight:600;
      background:var(--ink);color:#fff;border:none;border-radius:8px;cursor:pointer;
      font-family:var(--font);transition:all 0.2s;
    }
    .nav-cta:hover{background:var(--brand);transform:translateY(-1px);box-shadow:0 4px 16px rgba(108,99,255,0.3)}

    /* ── hero ── */
    .hero{
      position:fixed;inset:0;z-index:10;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:2rem;
    }

    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;
      font-family:var(--mono);font-size:0.72rem;font-weight:500;
      color:var(--brand);letter-spacing:0.04em;
      padding:0.45rem 1rem;border-radius:100px;
      background:rgba(108,99,255,0.07);border:1px solid rgba(108,99,255,0.18);
      margin-bottom:2rem;
      opacity:0;animation:fadeUp 0.7s 0.1s forwards;
    }
    .eyebrow .pulse{
      width:6px;height:6px;border-radius:50%;background:var(--brand);
      animation:pulse 2s infinite;
    }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

    .hero-title{
      font-size:clamp(2.75rem,7vw,5.5rem);
      font-weight:800;letter-spacing:-0.035em;line-height:1.02;
      color:var(--ink);margin-bottom:1.25rem;
      opacity:0;animation:fadeUp 0.7s 0.22s forwards;
    }
    .hero-title .accent{
      color:var(--brand);
      position:relative;
    }
    .hero-title .accent::after{
      content:'';position:absolute;left:2px;right:2px;bottom:0.08em;height:0.13em;
      background:rgba(108,99,255,0.16);z-index:-1;border-radius:2px;
    }

    .greek-line{
      font-family:var(--mono);font-size:0.95rem;font-weight:500;
      color:var(--text-soft);letter-spacing:0.06em;margin-bottom:2.5rem;
      opacity:0;animation:fadeUp 0.7s 0.34s forwards;
      display:flex;align-items:center;gap:10px;
    }
    .greek-line .sep{width:24px;height:1px;background:var(--line)}

    .hero-desc{
      font-size:1.05rem;line-height:1.7;color:var(--text-soft);
      max-width:480px;margin-bottom:2.75rem;font-weight:400;
      opacity:0;animation:fadeUp 0.7s 0.46s forwards;
    }

    .hero-btns{
      display:flex;gap:0.875rem;align-items:center;
      opacity:0;animation:fadeUp 0.7s 0.58s forwards;
    }

    .btn-primary{
      position:relative;padding:0.875rem 2rem;font-size:0.92rem;font-weight:600;
      background:var(--ink);color:#fff;border:none;border-radius:10px;cursor:pointer;
      font-family:var(--font);transition:all 0.25s cubic-bezier(0.2,0.8,0.2,1);
      display:inline-flex;align-items:center;gap:8px;overflow:hidden;
    }
    .btn-primary::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,var(--brand),var(--brand-soft));
      opacity:0;transition:opacity 0.25s;
    }
    .btn-primary span{position:relative;z-index:1;display:flex;align-items:center;gap:8px}
    .btn-primary:hover::before{opacity:1}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,99,255,0.35)}
    .btn-primary .arrow{transition:transform 0.25s}
    .btn-primary:hover .arrow{transform:translateX(3px)}

    .btn-secondary{
      padding:0.875rem 1.75rem;font-size:0.92rem;font-weight:600;
      background:transparent;color:var(--text);
      border:1.5px solid var(--line);border-radius:10px;cursor:pointer;
      font-family:var(--font);transition:all 0.2s;
    }
    .btn-secondary:hover{border-color:var(--brand);color:var(--brand);background:rgba(108,99,255,0.04)}

    /* ── bottom strip ── */
    .bottom-strip{
      position:fixed;bottom:0;left:0;right:0;z-index:50;
      border-top:1px solid var(--line);
      background:rgba(250,250,250,0.85);backdrop-filter:blur(12px);
      padding:1rem 3rem;
      display:flex;align-items:center;justify-content:space-between;
    }
    .strip-left{display:flex;align-items:center;gap:2rem}
    .strip-item{
      display:flex;align-items:center;gap:7px;
      font-size:0.78rem;color:var(--text-soft);font-weight:500;
    }
    .strip-dot{width:6px;height:6px;border-radius:50%;background:#22c55e}
    .strip-item.mono{font-family:var(--mono);font-size:0.74rem;color:#a0a0b0}
    .strip-copy{font-size:0.78rem;color:var(--text-soft);font-weight:500}

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(18px)}
      to{opacity:1;transform:translateY(0)}
    }
  </style>
</head>
<body>

<div class="grid-bg"></div>
<canvas id="bg-canvas"></canvas>

<nav>
  <div class="nav-logo"><span class="dot"></span>Phro<span>nesis</span></div>
  <div class="nav-links">
    <a onclick="window.location.href='/courses'">Courses</a>
    <a onclick="window.location.href='/login'">Sign in</a>
    <button class="nav-cta" onclick="window.location.href='/login'">Get started</button>
  </div>
</nav>

<section class="hero">
  <div class="eyebrow">
    <span class="pulse"></span>
    AI-powered learning platform
  </div>

  <h1 class="hero-title">
    Learn with <span class="accent">Phronesis</span>
  </h1>

  <div class="greek-line">
    <span class="sep"></span>
    φρόνησις — practical wisdom
    <span class="sep"></span>
  </div>

  <p class="hero-desc">
    A learning platform that adapts to you — a course-aware AI chatbot,
    personalised study plans, and instant quiz generation.
  </p>

  <div class="hero-btns">
    <button class="btn-primary" onclick="window.location.href='/login'">
      <span>Start learning <span class="arrow">→</span></span>
    </button>
    <button class="btn-secondary" onclick="window.location.href='/courses'">
      Browse courses
    </button>
  </div>
</section>

<div class="bottom-strip">
  <div class="strip-left">
    <div class="strip-item"><span class="strip-dot"></span>All systems operational</div>
    <div class="strip-item mono">FastAPI · SQLAlchemy · JWT</div>
  </div>
  <div class="strip-copy">© 2026 Phronesis</div>
</div>

<script>
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
  resize();
  window.addEventListener('resize', resize);

  const particles = Array.from({length:36},()=>({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    vx:(Math.random()-0.5)*0.18,
    vy:(Math.random()-0.5)*0.18,
    size:Math.random()*1.2+0.6,
  }));

  let mouse={x:-999,y:-999};
  document.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});

  function drawFrame(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>canvas.width)p.vx*=-1;
      if(p.y<0||p.y>canvas.height)p.vy*=-1;
      const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<110){p.x+=dx/d*0.5;p.y+=dy/d*0.5}
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle='rgba(108,99,255,0.28)';ctx.fill();
    });

    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<130){
          ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle=`rgba(108,99,255,${0.07*(1-d/130)})`;
          ctx.lineWidth=0.6;ctx.stroke();
        }
      }
    }
    requestAnimationFrame(drawFrame);
  }
  drawFrame();
</script>
</body>
</html>
